name: 🐛 Bug Report
description: File a bug report to help us fix an issue in CCloud+
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report an issue in CCloud+!
  - type: input
    id: os
    attributes:
      label: Operating System & Version
      placeholder: e.g. Ubuntu 24.04 LTS / Windows 11 23H2 / macOS 14 Sonoma
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: CCloud+ Version
      placeholder: e.g. v2.0.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error Logs or Screenshots
      description: Paste any terminal logs or attach screenshots if applicable.
