name: 💡 Feature Request
description: Propose a new idea, feature, or improvement for CCloud+
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thank you for suggesting a new idea to make CCloud+ better!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem or limitation is.
    validations:
      required: false
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Feature
      description: Describe what you would like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions Considered
      description: Describe any alternative solutions or features you've considered.
